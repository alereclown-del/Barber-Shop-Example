name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine Project Directory
        id: proj-dir
        run: |
          if [ -f "package.json" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "Barber-Shop-Example-main/package.json" ]; then
            echo "dir=Barber-Shop-Example-main" >> $GITHUB_OUTPUT
          else
            echo "No se encontró package.json en raíz ni en Barber-Shop-Example-main"
            exit 1
          fi

      - name: Install Dependencies
        working-directory: ${{ steps.proj-dir.outputs.dir }}
        run: npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        working-directory: ${{ steps.proj-dir.outputs.dir }}
        run: npm run build

      - name: Initialize and Sync Capacitor Android
        working-directory: ${{ steps.proj-dir.outputs.dir }}
        run: |
          npx --yes @capacitor/cli telemetry off || true
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli add android
          fi
          npx --yes @capacitor/cli sync android

      - name: Build Debug APK with Gradle
        working-directory: ${{ steps.proj-dir.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BarberShop-app-debug-apk
          path: |
            ${{ steps.proj-dir.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
            **/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
